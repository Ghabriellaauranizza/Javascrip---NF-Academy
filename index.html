<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 6 - Javascript</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            background-color: whitesmoke;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 1px solid rgb(201, 201, 201);
        }

        h1 {
            text-align: center;
            color: rgb(48, 48, 48);
        }

        .buttons {
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            margin: 5px;
            background: blue;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: cornflowerblue;
        }

        .btn-danger {
            background: red;
        }

        .btn-danger:hover {
            background: #dc3545;
        }

        .form-section {
            border: 1px solid rgb(205, 205, 205);
            padding: 15px;
            margin: 10px 0;
        }

        .form-section h3 {
            margin-top: 0;
        }

        input {
            padding: 5px;
            margin: 5px;
            border: 1px solid rgb(205, 205, 205);
            width: 200px;
        }

        #output {
            background: black;
            color: chartreuse;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            font-family: monospace;
            white-space: pre-wrap;
            margin: 10px 0;
            border: 1px solid rgb(48, 48, 48);
        }

        .user-list {
            border: 1px solid rgb(205, 205, 205);
            padding: 10px;
            margin: 10px 0;
        }

        .user-list h3 {
            margin-top: 0;
        }

        .user-item {
            border-bottom: 1px solid rgb(231, 231, 231);
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MANAJEMEN DATA PENGGUNA</h1>

        <!-- BUTTON PILIHAN -->
        <div class="buttons">
            <button onclick="showAllUsers()">Tampilkan Semua Data</button>
            <button onclick="showWithMap()">Tampilkan dengan Map</button>
            <button onclick="addSampleData()">Tambah 2 Data Sample</button>
            <button class="btn-danger" onclick="clearOutput()">Clear</button>
        </div>

        <!-- FORM DATA PENGGUNA -->
        <div class="form-section">
            <h3>Tambah Data Pengguna</h3>
            <input type="text" id="nama" placeholder="Nama Pengguna">
            <input type="number" id="umur" placeholder="Umur Pengguna">
            <input type="text" id="alamat" placeholder="Alamat Pengguna">
            <input type="email" id="email" placeholder="Email Pengguna">
            <button onclick="addUser()">Tambah</button>
        </div>
        
        <!-- FORM HAPUS DATA BERDASARKAN NAMA, INDEX, ATAU EMAIL -->
        <div class="form-section">
            <h3>Hapus Data Pengguna</h3>
            <input type="text" id="deleteInput" placeholder="Nama, email atau index">
            <button class="btn-danger" onclick="deleteUser()">Hapus Data</button>
        </div>

        <div id="userDisplay" class="user-list"></div>

        <div id="output">Program Siap Digunakan.</div>
    </div>

    <script type="module" src="main.js"></script>
    
</body>
</html>
