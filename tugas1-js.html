<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - JS</title>
</head>
<body>
    <script>
        //Deklarasi dan inisialisasi Persegipanjang
        let panjang = 12; 
        let lebar = 7;
        // Deklarasi dan inisialisasi Bujur Sangkar
        let sisi = 9;
        // Deklarasi dan inisialisasi segitiga
        let alas = 10;
        let tinggi = 6;

        // rumus luas 
        let luasPP = panjang * lebar; //persegi panjang
        let luasBJ = sisi * sisi; //Bujur sangkar
        let luasS = 0.5 * alas * tinggi; //segitiga

        //menghitung luas persegi panjang, bujur sangkar dan segitiga
        document.write(
            "Hasil Luas Persegi Panjang: " + luasPP + "cm" +
            "<br> Hasil Luas Bujur sangkar: " + luasBJ + "cm" +
            "<br> Hasil Luas Segitiga: " + luasS + "cm"
        );

        


    </script>
    
</body>
</html>
